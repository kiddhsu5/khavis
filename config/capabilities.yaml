# Capability → pool mappings for the llm-router.
#
# Each entry advertises a capability tag (see providers/* capabilities[])
# and a list of pool names that satisfy it. ``weight`` controls the
# weighted-random share used by ``CapabilityRouter.select``.
#
# Pool names referenced here MUST match the ``name`` attribute of the
# corresponding plugin instance (see providers/* for the canonical list).
#
# Note: pools tagged with ``BYOK-only`` providers (OpenAI Platform API,
# Claude API, NVIDIA Cloud) receive a slightly lower ``weight`` (0.85)
# because they require a separate billing account and may not be
# configured by every user. Your always-on local/Chinese pools keep
# weight 1.0–1.3.

capabilities:
  - capability: "中文"
    pools:
      - "MiniMax-M3"
      - "GLM-5.3"
      - "DeepSeek-V4-Pro"
      - "DeepSeek-V4.1-Flash"
      - "GLM-5.3-Flash"
      - "Ollama-Mac"
      - "Ollama-Surface"
    weight: 1.0

  - capability: "英文"
    pools:
      - "Google-Gemini"
      - "NVIDIA-Cloud"
      - "OpenRouter-Free"
      - "DeepSeek-V4-Pro"
      - "Ollama-Mac"
      - "OpenAI-API"
      - "Claude-API"
    weight: 1.0

  - capability: "程式碼"
    pools:
      - "GLM-5.3"
      - "DeepSeek-V4-Pro"
      - "NVIDIA-Cloud"
      - "OpenAI-API"
    weight: 1.2

  - capability: "推理"
