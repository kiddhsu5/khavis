[pytest]
# Default to unit tests only — integration tests require API keys
# and are opted into with ``pytest -m integration`` or ``-m ""``.
addopts = -ra -q --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: tests that require real API credentials and may incur quota
    unit: offline tests that mock all external I/O
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
